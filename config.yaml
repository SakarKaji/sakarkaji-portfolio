params:
  # header logo text (page title stays as "title" above)
  label:
    text: "Sakar Kaji Dotel"

  # theme
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false

  # for enchanced SEO
  env: production
  description: "Sakar Kaji Dotel – Full Stack Software Engineer specializing in Python, Django, Odoo ERP, and AWS."
  author: "Sakar Kaji Dotel"
  images: ["home/profile.png"]

  # Home Page
  profileMode:
    enabled: true
    title: "Sakar Kaji Dotel"
    # subtitle: Hi 👋 I'm Sakar, A Computer Science graduate and software engineer with genuine passion for learning and a strong interest in web development and AI.  I currently work as a backend engineer, where you’ll find me building cool things with Django harnessing cloud technology to enhance the scalability and responsiveness of the applications I develop.
    subtitle: |
              **Hi 👋 I’m Sakar**, a Computer Science graduate and software engineer with a genuine passion for learning and a strong interest in web development and AI.

              Currently, I work as a **full stack software engineer** — focusing on **Odoo ERP** development and building customized business solutions using **Python** and **JavaScript**. Previously, I worked on building scalable backend applications using **Django**, **REST APIs** and **cloud technology**.


    imageUrl: "home/profile.png"
    # imageUrl: "home/hero.jpg"
    imageWidth: 275
    imageHeight: 300
    # buttons:
    #   - name: Resume
    #     url: ""

  # List View
  hideDescriptionInList: false

  # cover image for posts
  cover:
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  socialIcons:
    - name: "email"
      url: "mailto:sakarkd@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/sakar-kaji-dotel/"
    - name: "github"
      url: "https://github.com/SakarKaji"
    - name: "gitlab"
      url: "https://gitlab.com/sakarkaji"

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - RSS
    - JSON

# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true
